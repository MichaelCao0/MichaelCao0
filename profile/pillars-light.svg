<svg xmlns="http://www.w3.org/2000/svg" width="920" height="148" viewBox="0 0 920 148" fill="none" role="img" aria-labelledby="pillarsTitleL">
  <title id="pillarsTitleL">Research Focus Pillars: MLLMs, Agentic AI, and World Models</title>
  <style>
    .idx { font: 600 11px "SF Mono", ui-monospace, Menlo, Consolas, monospace; fill: #626E68; }
    .tag { font: 600 10.5px "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .title { font: 600 18px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #141D19; }
    .desc { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #39443E; }
    .foot { font: 500 11px "SF Mono", ui-monospace, Menlo, Consolas, monospace; fill: #626E68; }
  </style>

  <!-- Pillar 01: MLLMs -->
  <g transform="translate(0, 2)">
    <rect x="0.75" y="0.75" width="294.5" height="142.5" rx="11" fill="#FAF9F5" stroke="#E0DCD0" stroke-width="1.5" />
    <path d="M12 1.5H284" stroke="#1D5C47" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="27" class="idx">01 · FOCUS</text>
    <rect x="206" y="14" width="72" height="19" rx="9.5" fill="#E3F3EA" stroke="#A6D8BB" />
    <text x="242" y="27" text-anchor="middle" class="tag" fill="#19643B">4 Works</text>
    <text x="18" y="56" class="title">Multimodal LLMs</text>
    <text x="18" y="80" class="desc">Audio-visual understanding, unified</text>
    <text x="18" y="98" class="desc">evaluation, and omni-modal generation.</text>
    <text x="18" y="126" class="foot">ICML · CVPR Oral · EMNLP · ICLR</text>
  </g>

  <!-- Pillar 02: Agentic AI -->
  <g transform="translate(312, 2)">
    <rect x="0.75" y="0.75" width="294.5" height="142.5" rx="11" fill="#FAF9F5" stroke="#E0DCD0" stroke-width="1.5" />
    <path d="M12 1.5H284" stroke="#573099" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="27" class="idx">02 · FOCUS</text>
    <rect x="206" y="14" width="72" height="19" rx="9.5" fill="#F1EBFC" stroke="#CBB6F3" />
    <text x="242" y="27" text-anchor="middle" class="tag" fill="#573099">3 Works</text>
    <text x="18" y="56" class="title">Agentic AI &amp; Post-Training</text>
    <text x="18" y="80" class="desc">Deep research, planning, continual</text>
    <text x="18" y="98" class="desc">distillation, and multi-turn safety.</text>
    <text x="18" y="126" class="foot">NeurIPS · ICLR · Tsinghua NLP</text>
  </g>

  <!-- Pillar 03: World Models -->
  <g transform="translate(624, 2)">
    <rect x="0.75" y="0.75" width="294.5" height="142.5" rx="11" fill="#FAF9F5" stroke="#E0DCD0" stroke-width="1.5" />
    <path d="M12 1.5H284" stroke="#295C99" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="27" class="idx">03 · FOCUS</text>
    <rect x="206" y="14" width="72" height="19" rx="9.5" fill="#E5EEFB" stroke="#ADC7EE" />
    <text x="242" y="27" text-anchor="middle" class="tag" fill="#1E5397">3 Works</text>
    <text x="18" y="56" class="title">World Models &amp; Robotics</text>
    <text x="18" y="80" class="desc">Closed-loop predictive models for</text>
    <text x="18" y="98" class="desc">software, robots, and embodied control.</text>
    <text x="18" y="126" class="foot">Loop Institute · AgiBot · arXiv</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="148" viewBox="0 0 920 148" fill="none" role="img" aria-labelledby="pillarsTitleD">
  <title id="pillarsTitleD">Research Focus Pillars: MLLMs, Agentic AI, and World Models</title>
  <style>
    .idx { font: 600 11px "SF Mono", ui-monospace, Menlo, Consolas, monospace; fill: #90A198; }
    .tag { font: 600 10.5px "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .title { font: 600 18px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #F2F6F4; }
    .desc { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #C8D5CE; }
    .foot { font: 500 11px "SF Mono", ui-monospace, Menlo, Consolas, monospace; fill: #879890; }
  </style>

  <!-- Pillar 01: MLLMs -->
  <g transform="translate(0, 2)">
    <rect x="0.75" y="0.75" width="294.5" height="142.5" rx="11" fill="#161F1B" stroke="#27352F" stroke-width="1.5" />
    <path d="M12 1.5H284" stroke="#6DC5A3" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="27" class="idx">01 · FOCUS</text>
    <rect x="206" y="14" width="72" height="19" rx="9.5" fill="#1B352B" stroke="#396D56" />
    <text x="242" y="27" text-anchor="middle" class="tag" fill="#92E2B2">4 Works</text>
    <text x="18" y="56" class="title">Multimodal LLMs</text>
    <text x="18" y="80" class="desc">Audio-visual understanding, unified</text>
    <text x="18" y="98" class="desc">evaluation, and omni-modal generation.</text>
    <text x="18" y="126" class="foot">ICML · CVPR Oral · EMNLP · ICLR</text>
  </g>

  <!-- Pillar 02: Agentic AI -->
  <g transform="translate(312, 2)">
    <rect x="0.75" y="0.75" width="294.5" height="142.5" rx="11" fill="#161F1B" stroke="#27352F" stroke-width="1.5" />
    <path d="M12 1.5H284" stroke="#B391F6" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="27" class="idx">02 · FOCUS</text>
    <rect x="206" y="14" width="72" height="19" rx="9.5" fill="#28213B" stroke="#5B4688" />
    <text x="242" y="27" text-anchor="middle" class="tag" fill="#D1BCFA">3 Works</text>
    <text x="18" y="56" class="title">Agentic AI &amp; Post-Training</text>
    <text x="18" y="80" class="desc">Deep research, planning, continual</text>
    <text x="18" y="98" class="desc">distillation, and multi-turn safety.</text>
    <text x="18" y="126" class="foot">NeurIPS · ICLR · Tsinghua NLP</text>
  </g>

  <!-- Pillar 03: World Models -->
  <g transform="translate(624, 2)">
    <rect x="0.75" y="0.75" width="294.5" height="142.5" rx="11" fill="#161F1B" stroke="#27352F" stroke-width="1.5" />
    <path d="M12 1.5H284" stroke="#7AB0F5" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="27" class="idx">03 · FOCUS</text>
    <rect x="206" y="14" width="72" height="19" rx="9.5" fill="#1B2A3E" stroke="#3B5D8C" />
    <text x="242" y="27" text-anchor="middle" class="tag" fill="#9EC7FB">3 Works</text>
    <text x="18" y="56" class="title">World Models &amp; Robotics</text>
    <text x="18" y="80" class="desc">Closed-loop predictive models for</text>
    <text x="18" y="98" class="desc">software, robots, and embodied control.</text>
    <text x="18" y="126" class="foot">Loop Institute · AgiBot · arXiv</text>
  </g>
</svg>

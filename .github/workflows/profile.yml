name: Refresh profile

on:
  schedule:
    # 09:23 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/update_research.py
      - research/**
      - tests/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Check Scholar parsing and cache fallback
        run: python3 -m unittest discover -s tests -v

      - name: Refresh publications and Scholar citations
        run: python3 .github/scripts/update_research.py

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews,prs_merged&bg_color=faf9f5&title_color=1d5c47&icon_color=1d5c47&text_color=2f3934&ring_color=1d5c47&border_color=e0dcd0&border_radius=10&card_width=540
          path: profile/stats.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews,prs_merged&bg_color=161f1b&title_color=6dc5a3&icon_color=6dc5a3&text_color=d2ddd7&ring_color=6dc5a3&border_color=27352f&border_radius=10&card_width=540
          path: profile/stats-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate light languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=faf9f5&title_color=1d5c47&text_color=2f3934&border_color=e0dcd0&border_radius=10&card_width=360
          path: profile/languages.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=161f1b&title_color=6dc5a3&text_color=d2ddd7&border_color=27352f&border_radius=10&card_width=360
          path: profile/languages-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=%231d5c47
            profile/snake-dark.svg?palette=github-dark&color_snake=%236dc5a3

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md research/scholar.json profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile citations and graphics"
            git pull --rebase
            git push
          fi

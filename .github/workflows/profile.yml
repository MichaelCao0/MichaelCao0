name: Refresh profile

on:
  schedule:
    # 09:23 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/update_activity.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Refresh recent public PRs and issues
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/update_activity.py

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews,prs_merged&hide_border=true&theme=default&card_width=720
          path: profile/stats.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews,prs_merged&hide_border=true&theme=github_dark&card_width=720
          path: profile/stats-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate light languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=default&card_width=360
          path: profile/languages.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=github_dark&card_width=360
          path: profile/languages-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=%2358a6ff
            profile/snake-dark.svg?palette=github-dark&color_snake=%2358a6ff

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile activity and graphics"
            git pull --rebase
            git push
          fi
